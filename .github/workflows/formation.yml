name: Validation formation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_support.py
      - name: Construire le workbook HTML
        run: |
          bash course/build.sh
          test -s course/index.html
          grep -q 'id="chapter-00"' course/index.html
          grep -q 'id="chapter-11"' course/index.html
          grep -q 'id="atelier-http"' course/index.html
          grep -q 'id="atelier-sqlite"' course/index.html
          grep -q 'id="defis"' course/index.html

  exemples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_dotnet.py
